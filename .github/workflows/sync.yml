
name: Sync upstream repository

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream
        shell: bash
        run: |
          set -euo pipefail

          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch original repository
          git remote add upstream https://github.com/JPaulYang/oxflow.git
          git fetch upstream main

          # Switch to target branch
          git checkout main

          # Check for new upstream commits
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date. No changes needed."
          else
            echo "New upstream commits detected."

            # Merge upstream changes
            git merge --no-edit upstream/main

            # Push updated target branch
            git push origin main

            echo "Synchronization completed successfully."
          fi
